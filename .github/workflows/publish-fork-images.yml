name: Publish Fork Images

on:
  workflow_dispatch:
  push:
    branches: [forkThat]
    paths:
      - 'backend/**'
      - 'ui/**'
      - 'messages/**'
      - '.github/workflows/publish-fork-images.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  DAEMON_IMAGE: ghcr.io/${{ github.repository }}/daemon

jobs:
  build-server:
    name: Build server (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server architecture
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=fork-server-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=fork-server-${{ matrix.suffix }}

  build-daemon-binaries:
    name: Build daemon (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            suffix: amd64
          - target: aarch64-unknown-linux-musl
            suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: fork-daemon-${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build daemon
        working-directory: backend
        run: cross build --release --bin daemon --target ${{ matrix.target }}

      - name: Prepare daemon binary
        run: |
          cp backend/target/${{ matrix.target }}/release/daemon scanopy-daemon-linux-${{ matrix.suffix }}
          chmod +x scanopy-daemon-linux-${{ matrix.suffix }}

      - name: Upload daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: fork-daemon-${{ matrix.suffix }}
          path: scanopy-daemon-linux-${{ matrix.suffix }}
          retention-days: 1

  publish-daemon:
    name: Publish daemon image
    runs-on: ubuntu-latest
    needs: build-daemon-binaries

    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 daemon
        uses: actions/download-artifact@v4
        with:
          name: fork-daemon-amd64
          path: backend

      - name: Download arm64 daemon
        uses: actions/download-artifact@v4
        with:
          name: fork-daemon-arm64
          path: backend

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push daemon image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.daemon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DAEMON_IMAGE }}:latest
            ${{ env.DAEMON_IMAGE }}:forkthat
            ${{ env.DAEMON_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=fork-daemon-image
          cache-to: type=gha,mode=max,scope=fork-daemon-image

  publish-server:
    name: Publish server manifest
    runs-on: ubuntu-latest
    needs: build-server

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture server tags
        run: |
          docker buildx imagetools create \
            -t "${SERVER_IMAGE}:latest" \
            -t "${SERVER_IMAGE}:forkthat" \
            -t "${SERVER_IMAGE}:sha-${GITHUB_SHA}" \
            "${SERVER_IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${SERVER_IMAGE}:sha-${GITHUB_SHA}-arm64"
