name: Publish Fork Images

on:
  workflow_dispatch:
  push:
    branches: [forkThat]
    paths:
      - 'backend/**'
      - 'ui/**'
      - 'messages/**'
      - '.github/workflows/publish-fork-images.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  DAEMON_IMAGE: ghcr.io/${{ github.repository }}/daemon

jobs:
  verify-source:
    name: Verify source before promotion
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libpcap-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Verify Rust source and dependencies
        working-directory: backend
        run: |
          cargo fmt --all --check
          cargo clippy --locked --bin server -- -D warnings
          cargo clippy --locked --bin daemon -- -D warnings
          cargo clippy --locked --bin daemon --features ad-gssapi -- -D warnings
          cargo test --locked --lib
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify UI source
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run check
          npm run lint

  build-server:
    name: Build server (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server architecture
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=fork-server-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=fork-server-${{ matrix.suffix }}

  build-daemon:
    name: Build daemon (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke-test, and push daemon architecture
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.daemon
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DAEMON_IMAGE }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=fork-daemon-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=fork-daemon-${{ matrix.suffix }}

  scan-images:
    name: Scan ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [build-server, build-daemon]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
            image: server
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
            image: server
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
            image: daemon
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
            image: daemon

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan immutable architecture image for critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.suffix }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

  publish-images:
    name: Publish verified image manifests
    runs-on: ubuntu-latest
    needs: [verify-source, build-server, build-daemon, scan-images]

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify every architecture image exists
        run: |
          docker buildx imagetools inspect "${SERVER_IMAGE}:sha-${GITHUB_SHA}-amd64"
          docker buildx imagetools inspect "${SERVER_IMAGE}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${DAEMON_IMAGE}:sha-${GITHUB_SHA}-amd64"
          docker buildx imagetools inspect "${DAEMON_IMAGE}:sha-${GITHUB_SHA}-arm64"

      - name: Publish immutable multi-architecture manifests
        run: |
          docker buildx imagetools create \
            -t "${SERVER_IMAGE}:sha-${GITHUB_SHA}" \
            "${SERVER_IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${SERVER_IMAGE}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools create \
            -t "${DAEMON_IMAGE}:sha-${GITHUB_SHA}" \
            "${DAEMON_IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${DAEMON_IMAGE}:sha-${GITHUB_SHA}-arm64"

      - name: Verify immutable manifests before mutable promotion
        run: |
          docker buildx imagetools inspect "${SERVER_IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${DAEMON_IMAGE}:sha-${GITHUB_SHA}"

      - name: Promote server and daemon together
        run: |
          docker buildx imagetools create \
            -t "${SERVER_IMAGE}:latest" \
            -t "${SERVER_IMAGE}:forkthat" \
            "${SERVER_IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            -t "${DAEMON_IMAGE}:latest" \
            -t "${DAEMON_IMAGE}:forkthat" \
            "${DAEMON_IMAGE}:sha-${GITHUB_SHA}"
